# One-time bootstrap: generates package-lock.json with the project's intended toolchain
# (Node 24 / npm 11 on Windows), verifies `npm ci` installs cleanly from it, and commits it.
# Runs only when package.json or this file changes on the Phase 2 branch.
name: Generate lockfile

on:
  push:
    branches: ['feature/phase-2-browser-usability']
    paths: ['package.json', '.github/workflows/lockfile.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  lockfile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate lockfile
        run: |
          echo "node $(node -v), npm $(npm -v)"
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      - name: Verify clean install with npm ci
        run: npm ci --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "Lockfile unchanged"; exit 0; fi
          git commit -m "Add package-lock.json (generated with Node $(node -v), npm $(npm -v))"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test, smoke test & build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: End-to-end smoke test (two isolated profiles + restart)
        run: node scripts/smoke-test.mjs

      - name: Package Windows installer and portable EXE
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: proxy-own-browser-windows
          path: release/*/*.exe
          if-no-files-found: error
          retention-days: 14

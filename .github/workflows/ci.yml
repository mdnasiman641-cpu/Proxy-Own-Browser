name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Test, smoke test & build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Show toolchain
        run: node -v && npm -v

      - name: Install dependencies (clean, from package-lock.json)
        run: npm ci --no-audit --no-fund 2>&1 | tee ci-install.log; exit ${PIPESTATUS[0]}

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee ci-typecheck.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: npm run lint 2>&1 | tee ci-lint.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        run: npm test 2>&1 | tee ci-test.log; exit ${PIPESTATUS[0]}

      - name: Build app
        run: npm run build 2>&1 | tee ci-build.log; exit ${PIPESTATUS[0]}

      - name: End-to-end smoke test (profiles, tabs, proxy tests, profile manager, restart)
        run: node scripts/smoke-test.mjs 2>&1 | tee ci-smoke.log; exit ${PIPESTATUS[0]}

      - name: Package Windows installer (npm run dist:win)
        run: npm run dist:win 2>&1 | tee ci-dist-win.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package portable EXE (npm run dist:portable)
        run: npm run dist:portable 2>&1 | tee ci-dist-portable.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Report results
        if: always()
        run: |
          # Surface the end of each step's output as annotations so results are readable
          # from the run summary without downloading logs.
          for f in ci-*.log; do
            [ -f "$f" ] || continue
            level=notice
            grep -qiE "error|fail|✗|×" "$f" && level=warning
            if [ "$f" = ci-smoke.log ]; then
              # One annotation per stage (annotations are size-limited) plus the overall result.
              for stage in setup verify; do
                part=$(grep -E "^\[smoke\] $stage:" "$f" | grep -vE ': PASS (dashboard renders|dashboard preload API available)$' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
                echo "::${level} title=ci-smoke.log ($stage)::${part}"
              done
              body=$(grep -E '^\[smoke\]' "$f" | grep -vE '^\[smoke\] (setup|verify):' | tail -n 20)
            else
              body=$(tail -n 45 "$f")
            fi
            body=$(printf '%s\n' "$body" | sed -e 's/\x1b\[[0-9;]*m//g' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::${level} title=${f}::${body}"
          done

      - name: List Windows executables
        run: |
          list=$(ls -l release/*/*.exe | awk '{printf "%s  %.1f MB%%0A", $NF, $5/1048576}')
          echo "::notice title=Windows executables::${list}"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: proxy-own-browser-windows
          path: release/*/*.exe
          if-no-files-found: error
          retention-days: 14

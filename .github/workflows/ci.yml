name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Test, smoke test & build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund 2>&1 | tee ci-install.log; exit ${PIPESTATUS[0]}

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee ci-typecheck.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        run: npm test 2>&1 | tee ci-test.log; exit ${PIPESTATUS[0]}

      - name: Build app
        run: npm run build 2>&1 | tee ci-build.log; exit ${PIPESTATUS[0]}

      - name: End-to-end smoke test (two isolated profiles + restart)
        run: node scripts/smoke-test.mjs 2>&1 | tee ci-smoke.log; exit ${PIPESTATUS[0]}

      - name: Package Windows installer and portable EXE
        run: npx electron-builder --win --x64 --publish never 2>&1 | tee ci-package.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Report results
        if: always()
        run: |
          # Surface the end of each step's output as annotations so results are readable
          # from the run summary without downloading logs.
          for f in ci-*.log; do
            [ -f "$f" ] || continue
            level=notice
            grep -qiE "error|fail|✗|×" "$f" && level=warning
            body=$(tail -n 45 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::${level} title=${f}::${body}"
          done

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: proxy-own-browser-windows
          path: release/*/*.exe
          if-no-files-found: error
          retention-days: 14

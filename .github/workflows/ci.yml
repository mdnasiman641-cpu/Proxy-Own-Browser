name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Test, smoke test & build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Show toolchain
        run: node -v && npm -v

      - name: Install dependencies (clean, from package-lock.json)
        run: npm ci --no-audit --no-fund 2>&1 | tee ci-install.log; exit ${PIPESTATUS[0]}

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee ci-typecheck.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: npm run lint 2>&1 | tee ci-lint.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        run: npm test 2>&1 | tee ci-test.log; exit ${PIPESTATUS[0]}

      - name: Build app
        run: npm run build 2>&1 | tee ci-build.log; exit ${PIPESTATUS[0]}

      - name: End-to-end smoke test (profiles, tabs, proxy tests, profile manager, restart)
        run: node scripts/smoke-test.mjs 2>&1 | tee ci-smoke.log; exit ${PIPESTATUS[0]}

      - name: Package Windows installer (npm run dist:win)
        run: npm run dist:win 2>&1 | tee ci-dist-win.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package portable EXE (npm run dist:portable)
        run: npm run dist:portable 2>&1 | tee ci-dist-portable.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Report results
        if: always()
        run: |
          # Surface results as a few annotations (GitHub limits how many a step can show), so
          # they are readable from the run summary without downloading logs.
          emit() {
            body=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' "$3" | awk '{printf "%s%%0A", $0}')
            echo "::$1 title=$2::${body}"
          }
          for f in ci-install.log ci-typecheck.log ci-lint.log ci-build.log ci-dist-win.log ci-dist-portable.log; do
            [ -f "$f" ] || continue
            if grep -qiE "error|failed" "$f"; then tail -n 40 "$f" > report.txt; emit warning "$f" report.txt; fi
          done
          if [ -f ci-test.log ]; then tail -n 25 ci-test.log > report.txt; emit notice ci-test.log report.txt; fi
          if [ -f ci-smoke.log ]; then
            { grep -E '^\[smoke\] [a-z]+: (FAIL|WARN)' ci-smoke.log; grep -E '^\[smoke\]' ci-smoke.log | grep -vE '^\[smoke\] [a-z]+: '; } > report.txt || true
            if grep -qE 'FAIL|no result|FAILED' report.txt; then level=warning; else level=notice; fi
            emit $level "smoke test: summary and problems" report.txt
            grep -E '^\[smoke\] setup: PASS' ci-smoke.log | head -n 60 > report.txt || true
            [ -s report.txt ] && emit notice "smoke test: setup checks (1)" report.txt
            grep -E '^\[smoke\] setup: PASS' ci-smoke.log | tail -n +61 > report.txt || true
            [ -s report.txt ] && emit notice "smoke test: setup checks (2)" report.txt
            grep -E '^\[smoke\] verify: PASS' ci-smoke.log > report.txt || true
            [ -s report.txt ] && emit notice "smoke test: restart checks" report.txt
            grep -E '^\[smoke-log\]' ci-smoke.log | tail -n 70 > report.txt || true
            [ -s report.txt ] && emit warning "smoke test: app log after failure" report.txt
          fi
          exit 0

      - name: List Windows executables
        run: |
          list=$(ls -l release/*/*.exe | awk '{printf "%s  %.1f MB%%0A", $NF, $5/1048576}')
          echo "::notice title=Windows executables::${list}"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: proxy-own-browser-windows
          path: release/*/*.exe
          if-no-files-found: error
          retention-days: 14
